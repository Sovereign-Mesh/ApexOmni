name: Build APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          openjdk-17-jdk unzip zip
          pip3 install --upgrade pip
          pip3 install buildozer cython virtualenv

      - name: Execute Buildozer Engine
        run: |
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE_NET: "y"

      - name: Archive and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexOmni-Operational-Package
          path: bin/*.apk
          retention-days: 7
